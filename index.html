
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Anniversary Mary ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 20px;
    animation: floatUp 6s linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-100vh) scale(1.5);
      opacity: 0;
    }
  }

  .card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    position: relative;
    z-index: 2;
  }

  h1 {
    color: #e91e63;
    margin-bottom: 10px;
  }

  p {
    font-size: 18px;
    margin-bottom: 25px;
  }

  button {
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
  }

  #yesBtn {
    background-color: #4caf50;
    color: white;
  }

  #noBtn {
    background-color: #f44336;
    color: white;
    position: absolute;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Mary ❤️</h1>
  <p id="question"></p>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 😒</button>
</div>

<script>
  // Questions
  const questions = [
    "Do you love me, Mary? 😘",
    "Do I make your world brighter? ✨",
    "Will you keep choosing me every day? 💑",
    "Am I your forever person? 💍",
    "Will you stay with me forever, Mary? ❤️"
  ];

  let index = 0;

  const questionEl = document.getElementById("question");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const card = document.getElementById("card");

  questionEl.innerText = questions[index];

  // YES logic
  yesBtn.addEventListener("click", () => {
    index++;

    if (index < questions.length) {
      questionEl.innerText = questions[index];
    } else {
      document.body.innerHTML = `
        <div style="
          display:flex;
          height:100vh;
          align-items:center;
          justify-content:center;
          text-align:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:'Segoe UI',sans-serif;
          padding:20px;
        ">
          <h1 style="color:white;font-size:32px;">
            I knew it, Mary 😘❤️<br><br>
            Happy Anniversary, my love!<br>
            Forever looks perfect with you 💕
          </h1>
        </div>
      `;
    }
  });

  // NO button escape
  noBtn.addEventListener("mouseover", () => {
    const maxX = card.clientWidth - noBtn.offsetWidth;
    const maxY = card.clientHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  // Floating hearts generator
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 7000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
